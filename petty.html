<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>零用金｜Sunny Office</title>
<style>
:root{--bg:#fbf6ef;--ink:#4d4a47;--sub:#8c857d;--g:#86ab98;--p:#dc8f80;--y:#e6c16a;--line:#eadfd2;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:#c9a35c;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;align-items:center;gap:10px}
header a{color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:10px;padding:4px 12px;text-decoration:none;font-size:14px}header b{font-size:18px}
main{max-width:720px;margin:0 auto;padding:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
select,input,textarea{font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:12px;padding:7px 10px;background:#fffdf9;color:var(--ink);min-width:0}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;min-height:42px}
.b{border:1px solid var(--line);background:#fffdf9;border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.b.on{background:var(--p);border-color:var(--p);color:#fff}.b.g{background:var(--g);border-color:var(--g);color:#fff}.b.y{background:#c9a35c;border-color:#c9a35c;color:#fff}
.b:disabled{opacity:.5}
.card{background:#fffdf9;border-radius:20px;padding:12px 14px;margin-bottom:12px;box-shadow:0 4px 0 var(--line)}
.card h3{margin:0 0 6px;font-size:17px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:15px}.kv b{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:22px}
.ok{color:#3f8a5c;font-weight:800}.bad{color:#c4513e;font-weight:800}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.it{background:#fffdf9;border-radius:18px;padding:10px 14px;margin-bottom:10px;box-shadow:0 3px 0 var(--line)}
.it .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.it .t b{font-size:16px}
.it small{color:var(--sub)}.amt{color:var(--p);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.st{display:inline-block;border-radius:999px;padding:0 9px;font-size:12px;margin-right:6px}.st.u{background:#fbe9c8}.st.r{background:#e2f0e6}
.fm{background:#fffdf9;border:2px dashed #c9a35c;border-radius:20px;padding:12px;margin-bottom:12px}
.fm label{display:block;font-size:13px;color:var(--sub);margin:6px 0 2px}.fm input,.fm select,.fm textarea{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ir{border:1.5px dashed var(--line);border-radius:14px;padding:8px;margin:6px 0;display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px}
.ir .w{grid-column:1/-1}.ir .bt{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.den{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center}.den span:last-child{text-align:right;font-variant-numeric:tabular-nums;min-width:80px}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.ph img{width:80px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
table.s{width:100%;border-collapse:collapse;font-size:14px}table.s td,table.s th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}table.s td.n,table.s th.n{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--sub)}
#pv{display:none}
/* 列印：經費支出表、封面、撥補明細 */
.pg{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#000;page-break-after:always;padding:0}.pg:last-child{page-break-after:auto}
.pg h1{font-size:17pt;text-align:center;margin:0;text-decoration:underline;font-weight:500}
.pg .rd{text-align:right;font-size:11pt;margin:2px 0 4px}
.pg table{width:100%;border-collapse:collapse;table-layout:fixed}.pg td,.pg th{border:1px solid #000;font-size:11pt;padding:3px;text-align:center;font-weight:400;word-break:break-all}
.pg .dg td{font-size:9.5pt;padding:1px}.pg .dv td{height:10mm;font-size:12pt}
.pg .sg{margin:7mm 0 4mm;font-size:11pt;display:flex;justify-content:space-between}
.pg .hint{text-align:center;font-size:10.5pt;margin:2mm 0 3mm}
.pg .itm th{background:#ddd;text-align:left}.pg .itm td{height:7.4mm;text-align:left}.pg .itm td.n{text-align:right}
.pg .rc{margin-top:8mm;font-size:11.5pt;line-height:2.2}
.pg.cv{display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:255mm;padding:80mm 0 50mm;font-size:16pt;text-align:center;line-height:2.1}
@media print{@page{size:A4 portrait;margin:14mm 16mm}body{background:#fff}header,main{display:none!important}#pv{display:block}}
</style></head><body>
<header><a href="index.html">← Sunny Office</a><b>💰 零用金</b></header>
<main id="app"><p class="note">載入中…</p></main>
<div id="pv"></div>
<script type="module">
import { SF } from "./cloud.js";
var $=function(i){return document.getElementById(i)},KEY="docs_staff_petty",PHK="docs_staff_pettyph_";
var E=function(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")};
var N=function(v){v=+v;return isFinite(v)?v:0},M=function(v){return Math.round(N(v)).toLocaleString()};
var DEN=[1000,500,200,100,50,10,5,1];
var DEF={quota:20000,subj:["薪資支出","勞健退","伙食","水費","電費","郵電費","職工福利","教材費","活動費","雜支","暫收付","租金","稅捐","退費","設備-購置","設備-修繕","交際費"],cats:[["臺電","電費"],["水費","水費"],["文具","雜支"],["清潔","雜支"],["教具採買","教材費"],["老師時薪費用","薪資支出"],["交際費","交際費"]],v:[],reps:[],counts:[]};
var OLD_SUBJ='["人事費","業務費","設備費","雜支"]',LKEY="docs_staff_ledger",LD=null;
function subjOf(c){var m=D.cats.filter(function(x){return x[0]===c})[0];return m?m[1]:""}
var D=null,tab="v",ed=null,cur=null,mon="",fs="",cnt={};
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function roc(d){var m=String(d||"").match(/^(\d{4})-(\d\d)-(\d\d)/);return m?[m[1]-1911,+m[2],+m[3]]:["","",""]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function tot(v){return v.items.reduce(function(s,i){return s+N(i.p)*N(i.q)},0)}
function unpaid(){return D.v.filter(function(v){return!v.rep})}
function unpaidSum(){return unpaid().reduce(function(s,v){return s+tot(v)},0)}
function book(){return N(D.quota)-unpaidSum()}
function nextNo(){return D.v.reduce(function(m,v){return Math.max(m,parseInt(v.no,10)||0)},0)+1}
function save(){SF.set("docs",KEY,{data:JSON.stringify(D)})}

// ===== 畫面 =====
function render(){if(!D)return;var h="";
 var ub=unpaidSum(),bk=book();
 h+='<div class="card"><h3>零用金現況</h3><div class="kv"><span>定額</span><b>$'+M(D.quota)+'</b><span>未撥補支出（'+unpaid().length+' 張憑證）</span><b>−$'+M(ub)+'</b><span>帳面應有現金</span><b class="big">$'+M(bk)+'</b></div>'+lastCount()+'</div>';
 h+='<div class="tabs">'+[["v","🧾 憑證"],["c","🪙 點鈔對帳"],["r","🔄 撥補"],["s","📊 月統計"],["set","⚙️ 設定"]].map(function(t){return'<button class="b'+(tab===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join("")+'</div>';
 if(tab==="v")h+=vUI();else if(tab==="c")h+=cUI();else if(tab==="r")h+=rUI();else if(tab==="s")h+=sUI();else h+=setUI();
 $("app").innerHTML=h;if(tab==="v"&&ed)itR();if(tab==="c")cCalc()}
function lastCount(){var c=D.counts[D.counts.length-1];if(!c)return'<p class="note" style="margin:8px 0 0">還沒有點鈔紀錄，到「🪙 點鈔對帳」點一次現金，看看是否持平。</p>';
 return'<p style="margin:8px 0 0;font-size:14px">上次點鈔（'+E(c.date)+(c.by?'，'+E(c.by):'')+'）：現金 $'+M(c.cash)+'，'+diffTxt(c.cash-c.book)+'</p>'}
function diffTxt(d){return d===0?'<span class="ok">✅ 持平</span>':d<0?'<span class="bad">短少 $'+M(-d)+'</span>':'<span class="bad">多出 $'+M(d)+'</span>'}

// 憑證
function vUI(){var h="";
 if(ed)return formUI();
 h+='<div class="bar"><button class="b y" data-act="new">＋ 新增憑證</button><input type="month" id="mon" value="'+mon+'"><select id="fs"><option value="">全部用途類別</option>'+D.cats.map(function(c){return'<option'+(c[0]===fs?' selected':'')+'>'+E(c[0])+'</option>'}).join("")+'</select></div>';
 var L=D.v.filter(function(v){return(!mon||String(v.date).slice(0,7)===mon)&&(!fs||v.cat===fs)}).sort(function(a,b){return(parseInt(b.no,10)||0)-(parseInt(a.no,10)||0)});
 h+='<p class="note">共 '+L.length+' 張，合計 $'+M(L.reduce(function(s,v){return s+tot(v)},0))+'</p>';
 h+=L.map(function(v){return'<div class="it"><div class="t"><b>#'+E(v.no)+' '+E(v.cat||"（未選用途）")+'</b><span class="amt">$'+M(tot(v))+'</span></div><small><span class="st '+(v.rep?'r">已撥補':'u">未撥補')+'</span>'+E(v.date)+(v.subj?' ・ '+E(v.subj):'')+(v.payee?' ・ 領款人 '+E(v.payee):'')+(v.nph?' ・ 📎'+v.nph:'')+'</small><div style="font-size:14px">'+E(v.items.map(function(i){return i.n}).filter(Boolean).join("、"))+'</div><div class="bar" style="margin:6px 0 0"><button class="b" data-ed="'+v.id+'">編輯</button><button class="b" data-pr="'+v.id+'">🖨️ 列印支出表</button></div></div>'}).join("")||'<p class="note" style="text-align:center">這個條件下沒有憑證。</p>';
 h+='<div class="bar" style="margin-top:6px"><button class="b" data-act="prm">🖨️ 列印本月全部支出表</button><button class="b" data-act="cover">🖨️ 列印封面</button><button class="b" data-act="xl">📥 匯出 Excel</button></div>';
 return h}
function formUI(){var v=ed;return'<div class="fm"><b>'+(D.v.some(function(x){return x.id===v.id})?"編輯":"新增")+'憑證 #'+E(v.no)+'</b>'+(v.rep?'<p class="note">這張已經撥補過，修改金額會影響撥補紀錄。</p>':'')+
 '<div class="row2"><div><label>日期</label><input type="date" id="f_date" value="'+E(v.date)+'"></div><div><label>編號</label><input id="f_no" value="'+E(v.no)+'"></div></div>'+
 '<div class="row2"><div><label>用途類別</label><select id="f_cat">'+(v.cat&&!subjOf(v.cat)?[[v.cat,""]]:[]).concat(D.cats).map(function(c){return'<option'+(c[0]===v.cat?' selected':'')+'>'+E(c[0])+'</option>'}).join("")+'</select></div><div><label>科目（自動帶出，可改）</label><select id="f_subj">'+(v.subj&&D.subj.indexOf(v.subj)<0?[v.subj]:[]).concat(D.subj).map(function(s){return'<option'+(s===v.subj?' selected':'')+'>'+E(s)+'</option>'}).join("")+'</select></div></div>'+
 '<label>明細（金額自動計算）</label><div id="itw"></div><button class="b" type="button" data-act="iadd">＋ 新增一項</button>'+
 '<p style="margin:8px 0 0">金額總計：<span class="amt" id="f_tot">$'+M(tot(v))+'</span></p>'+
 '<div class="row2"><div><label>領款人</label><input id="f_payee" value="'+E(v.payee)+'"></div><div><label>備註（選填）</label><input id="f_note" value="'+E(v.note)+'"></div></div>'+
 '<label>單據照片（選填，最多 2 張）</label><input type="file" id="f_ph" accept="image/*" multiple><div class="ph" id="f_pv"></div>'+
 '<div class="bar" style="margin-top:10px"><button class="b g" data-act="vok">儲存</button><button class="b" data-act="vno">取消</button>'+(D.v.some(function(x){return x.id===v.id})?'<button class="b" data-act="vdel" style="margin-left:auto">刪除</button>':'')+'</div></div>'}
function itR(){var w=$("itw");if(!w)return;w.innerHTML=ed.items.map(function(i,k){return'<div class="ir"><input class="w" data-i="'+k+'" data-k="n" placeholder="項目" value="'+E(i.n)+'"><input data-i="'+k+'" data-k="p" type="number" inputmode="decimal" placeholder="單價" value="'+E(i.p)+'"><input data-i="'+k+'" data-k="q" type="number" inputmode="decimal" placeholder="數量" value="'+E(i.q)+'"><input data-i="'+k+'" data-k="note" placeholder="備註" value="'+E(i.note)+'"><div class="bt"><span>金額 <b data-sum="'+k+'">$'+M(N(i.p)*N(i.q))+'</b></span>'+(ed.items.length>1?'<button class="b" type="button" data-idel="'+k+'">✕ 移除</button>':'')+'</div></div>'}).join("");pv()}
function pv(){var p=$("f_pv");if(p)p.innerHTML=(ed.ph||[]).map(function(u,k){return'<span><img src="'+u+'"><br><a href="#" data-phx="'+k+'" style="font-size:12px;color:#c33">移除</a></span>'}).join("")}
function readForm(){["date","no","subj","cat","payee","note"].forEach(function(k){var el=$("f_"+k);if(el)ed[k]=el.value.trim()})}
async function openEdit(id){var v=D.v.filter(function(x){return x.id===id})[0];if(!v)return;ed=JSON.parse(JSON.stringify(v));ed.ph=null;tab="v";render();
 try{var d=await getPh(id);ed.ph=d}catch(e){ed.ph=[]}pv()}
function getPh(id){return new Promise(function(res){var u=SF.watchDoc("docs",PHK+id,function(d){u&&u();res((d&&d.ph)||[])},function(){res([])})})}

// 點鈔
function cUI(){var bk=book();return'<div class="card"><h3>點鈔對帳</h3><p class="note" style="margin:0 0 8px">把零用金盒裡的現金依面額數一數，填張數或枚數。</p><div class="den">'+DEN.map(function(d){return'<span>'+(d>=100?d+' 元鈔':d+' 元硬幣')+'</span><input type="number" inputmode="numeric" min="0" data-den="'+d+'" value="'+E(cnt[d]||"")+'" placeholder="0"><span data-dsum="'+d+'"></span>'}).join("")+'</div>'+
 '<div class="kv" style="margin-top:10px;border-top:1px dashed var(--line);padding-top:8px"><span>實際現金</span><b id="c_cash"></b><span>帳面應有現金（定額 $'+M(D.quota)+' − 未撥補 $'+M(unpaidSum())+'）</span><b>$'+M(bk)+'</b><span>結果</span><b id="c_res"></b></div>'+
 '<div class="row2" style="margin-top:8px"><input id="c_by" placeholder="點鈔人"><input id="c_note" placeholder="備註（選填）"></div><div class="bar" style="margin-top:8px"><button class="b g" data-act="csave">記錄這次點鈔</button><button class="b" data-act="cclr">清空</button></div></div>'+
 '<div class="card"><h3>點鈔紀錄</h3>'+(D.counts.length?'<table class="s"><tr><th>日期</th><th>點鈔人</th><th class="n">現金</th><th class="n">帳面</th><th>結果</th><th></th></tr>'+D.counts.slice().reverse().map(function(c){return'<tr><td>'+E(c.date)+'</td><td>'+E(c.by)+'</td><td class="n">'+M(c.cash)+'</td><td class="n">'+M(c.book)+'</td><td>'+diffTxt(c.cash-c.book)+(c.note?'<br><small>'+E(c.note)+'</small>':'')+'</td><td><button class="b" data-cdel="'+c.id+'">✕</button></td></tr>'}).join("")+'</table>':'<p class="note">還沒有紀錄。</p>')+'</div>'}
function cCash(){return DEN.reduce(function(s,d){return s+d*N(cnt[d])},0)}
function cCalc(){DEN.forEach(function(d){var el=document.querySelector('[data-dsum="'+d+'"]');if(el)el.textContent=cnt[d]?"$"+M(d*N(cnt[d])):""});var c=cCash();if($("c_cash"))$("c_cash").textContent="$"+M(c);if($("c_res"))$("c_res").innerHTML=diffTxt(c-book())}

// 撥補
function rUI(){var U=unpaid().sort(function(a,b){return(parseInt(a.no,10)||0)-(parseInt(b.no,10)||0)}),s=unpaidSum();
 return'<div class="card"><h3>這期要撥補</h3>'+(U.length?'<table class="s"><tr><th>編號</th><th>日期</th><th>科目</th><th class="n">金額</th></tr>'+U.map(function(v){return'<tr><td>#'+E(v.no)+'</td><td>'+E(v.date)+'</td><td>'+E(v.subj)+'</td><td class="n">'+M(tot(v))+'</td></tr>'}).join("")+'<tr><th colspan="3">合計</th><th class="n">'+M(s)+'</th></tr></table><p class="note">撥補 $'+M(s)+' 後，零用金會回到定額 $'+M(D.quota)+'。</p><div class="row2"><input type="date" id="r_date" value="'+today()+'"><button class="b y" data-act="rep">完成撥補</button></div>':'<p class="note">目前沒有未撥補的憑證。</p>')+'</div>'+
 '<div class="card"><h3>撥補紀錄</h3>'+(D.reps.length?D.reps.slice().reverse().map(function(r){return'<div class="it"><div class="t"><b>'+E(r.date)+' 撥補</b><span class="amt">$'+M(r.amt)+'</span></div><small>'+r.ids.length+' 張憑證</small><div class="bar" style="margin:6px 0 0"><button class="b" data-rpr="'+r.id+'">🖨️ 列印撥補明細</button><button class="b" data-rdel="'+r.id+'">取消這次撥補</button></div></div>'}).join(""):'<p class="note">還沒有撥補紀錄。</p>')+'</div>'}

// 月統計
function sUI(){var m=mon||today().slice(0,7),L=D.v.filter(function(v){return String(v.date).slice(0,7)===m}),t=L.reduce(function(s,v){return s+tot(v)},0);
 function tb(lab,key){var g={},n={};L.forEach(function(v){var k=v[key]||"（未選）";g[k]=(g[k]||0)+tot(v);n[k]=(n[k]||0)+1});return'<h3 style="margin-top:10px">依'+lab+'</h3><table class="s"><tr><th>'+lab+'</th><th class="n">張數</th><th class="n">金額</th></tr>'+Object.keys(g).sort(function(a,b){return g[b]-g[a]}).map(function(k){return'<tr><td>'+E(k)+'</td><td class="n">'+n[k]+'</td><td class="n">'+M(g[k])+'</td></tr>'}).join("")+'<tr><th>合計</th><th class="n">'+L.length+'</th><th class="n">'+M(t)+'</th></tr></table>'}
 return'<div class="card"><div class="bar"><input type="month" id="smon" value="'+m+'"></div>'+tb("科目","subj")+tb("用途類別","cat")+'</div>'}

// 設定
function setUI(){return'<div class="card"><h3>設定</h3><label class="note">零用金定額（元）</label><input id="s_quota" type="number" inputmode="numeric" value="'+E(D.quota)+'" style="width:100%"><label class="note" style="display:block;margin-top:8px">科目（一行一個）</label><textarea id="s_subj" rows="5" style="width:100%">'+E(D.subj.join("\n"))+'</textarea><label class="note" style="display:block;margin-top:8px">用途類別＝科目（一行一個，例如「臺電＝業務費」）</label><textarea id="s_cats" rows="9" style="width:100%">'+E(D.cats.map(function(c){return c[0]+"＝"+c[1]}).join("\n"))+'</textarea><div class="bar" style="margin-top:8px"><button class="b g" data-act="sset">儲存設定</button></div></div>'}

// ===== 列印 =====
function digits(n){var c=Math.round(N(n)*100),s=String(c),cells=9,a=[];for(var i=0;i<cells;i++){var k=s.length-cells+i;a.push(k>=0?s[k]:"")}return a}
function vPage(v){var d=roc(v.date),dg=digits(tot(v)),rows=v.items.slice();while(rows.length<17)rows.push({});
 return'<div class="pg"><h1>臺南市私立初晴之森托嬰中心經費支出表</h1><div class="rd">中華民國 '+d[0]+' 年 '+d[1]+' 月 '+d[2]+' 日</div>'+
