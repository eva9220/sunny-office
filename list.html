.b.on{background:var(--p);border-color:var(--p);color:#fff}.b.g{background:var(--g);border-color:var(--g);color:#fff}
.sum{background:#fffdf9;border-radius:18px;padding:10px 14px;margin-bottom:12px;box-shadow:0 3px 0 var(--line);font-size:14px}
