<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>本帳｜Sunny Office</title>
<style>
:root{--bg:#fbf6ef;--ink:#4d4a47;--sub:#8c857d;--g:#86ab98;--p:#dc8f80;--line:#eadfd2;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:#7f9cc0;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;align-items:center;gap:10px}
header a{color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:10px;padding:4px 12px;text-decoration:none;font-size:14px}header b{font-size:18px}
main{max-width:860px;margin:0 auto;padding:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
select,input,textarea{font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:12px;padding:7px 10px;background:#fffdf9;color:var(--ink);min-width:0}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;min-height:42px}
.b{border:1px solid var(--line);background:#fffdf9;border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.b.on{background:var(--p);border-color:var(--p);color:#fff}.b.g{background:var(--g);border-color:var(--g);color:#fff}.b.bl{background:#7f9cc0;border-color:#7f9cc0;color:#fff}
.card{background:#fffdf9;border-radius:20px;padding:12px 14px;margin-bottom:12px;box-shadow:0 4px 0 var(--line)}
.card h3{margin:0 0 6px;font-size:17px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:15px}.kv b{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:22px}.ok{color:#3f8a5c;font-weight:800}.bad{color:#c4513e;font-weight:800}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.note{font-size:13px;color:var(--sub)}
.tw{overflow-x:auto;background:#fffdf9;border-radius:16px;box-shadow:0 3px 0 var(--line)}
table.s{width:100%;border-collapse:collapse;font-size:14px}table.s td,table.s th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;white-space:nowrap}
table.s td.n,table.s th.n{text-align:right;font-variant-numeric:tabular-nums}table.s td.w{white-space:normal;min-width:140px}
table.s tr.e:hover{background:#f6efe4;cursor:pointer}.in{color:#3f8a5c}.out{color:#c4513e}
table.bg input{width:88px;text-align:right;padding:4px 6px}
.fm{background:#fffdf9;border:2px dashed #7f9cc0;border-radius:20px;padding:12px;margin-bottom:12px}
.fm label{display:block;font-size:13px;color:var(--sub);margin:6px 0 2px}.fm input,.fm select{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body>
<header><a href="index.html">← Sunny Office</a><b>📒 本帳</b></header>
<main id="app"><p class="note">載入中…</p></main>
<input type="file" id="imf" accept=".xlsx" hidden><input type="file" id="pimf" accept=".xlsx" hidden>
<script type="module">
import { SF } from "./cloud.js";
import { readSheet } from "./xlsximport.js";
var $=function(i){return document.getElementById(i)},KEY="docs_staff_ledger",PKEY="docs_staff_petty";
var E=function(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")};
var N=function(v){v=+v;return isFinite(v)?v:0},M=function(v){return Math.round(N(v)).toLocaleString()};
var BUDGET_SUBJ=["薪資支出","勞健退","伙食","水費","電費","郵電費","職工福利","教材費","活動費","雜支","暫收付","租金","稅捐","退費","設備-購置","設備-修繕","交際費"];
var DEF={rows:[],subj:["股金","利息","租金","土地","建築","工程","設備","訂金","零用金"].concat(BUDGET_SUBJ.filter(function(s){return s!=="租金"})),budget:{},bstart:"2026-09",bank:"",pay:[]};
var ped=null,pop="";
var D=null,P=null,tab="l",ed=null,mon="",fs="",q="";
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function roc(d){var m=String(d||"").match(/^(\d{4})-(\d\d)-(\d\d)/);return m?(m[1]-1911)+"/"+m[2]+"/"+m[3]:d||""}
function iso(v){if(typeof v==="number"&&v>20000){var d=new Date(Date.UTC(1899,11,30)+Math.floor(v)*864e5);return d.toISOString().slice(0,10)}
 var m=String(v||"").trim().match(/^(\d{2,4})[\/.\-年](\d{1,2})[\/.\-月](\d{1,2})/);if(!m)return"";var y=+m[1];if(y<1000)y+=1911;return y+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0")}
function sorted(){return D.rows.map(function(r,i){r._i=i;return r}).slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.ord||a._i)-(b.ord||b._i)})}
function withBal(){var b=0;return sorted().map(function(r){b+=N(r.inc)-N(r.exp);return{r:r,bal:b}})}
function tots(){return D.rows.reduce(function(s,r){s[0]+=N(r.inc);s[1]+=N(r.exp);return s},[0,0])}
function save(){SF.set("docs",KEY,{data:JSON.stringify(D)})}
function months(){var a=[],y=+D.bstart.slice(0,4),m=+D.bstart.slice(5);for(var i=0;i<6;i++){a.push(y+"-"+String(m).padStart(2,"0"));m++;if(m>12){m=1;y++}}return a}

function render(){if(!D)return;var t=tots(),bal=t[0]-t[1],h="";
 h+='<div class="card"><h3>帳戶現況</h3><div class="kv"><span>總收入</span><b class="in">$'+M(t[0])+'</b><span>總支出</span><b class="out">$'+M(t[1])+'</b><span>本帳餘額</span><b class="big">$'+M(bal)+'</b></div>'+
  (payOut()?'<p style="margin:8px 0 0;font-size:14px">📑 未付尾款 <b class="bad">$'+M(payOut())+'</b>，全部付清後餘額 <b>$'+M(bal-payOut())+'</b></p>':'')+'<div class="bar" style="margin:8px 0 0"><span style="font-size:14px">網銀結餘</span><input id="bank" type="number" inputmode="numeric" value="'+E(D.bank)+'" placeholder="輸入網銀或存摺結餘" style="flex:1"><span id="bres">'+bankRes(bal)+'</span></div></div>';
 h+='<div class="tabs">'+[["l","📒 收支表"],["p","📑 應付尾款"],["b","📊 預算對照"],["set","⚙️ 設定"]].map(function(x){return'<button class="b'+(tab===x[0]?' on':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div>';
 h+=tab==="l"?lUI():tab==="p"?pUI():tab==="b"?bUI():setUI();$("app").innerHTML=h}
function bankRes(bal){if(D.bank===""||D.bank==null)return"";var d=N(D.bank)-bal;return d===0?'<span class="ok">✅ 對平</span>':'<span class="bad">差 '+(d>0?"+":"−")+M(Math.abs(d))+'</span>'}

function lUI(){var h="";if(ed)return formUI();
 h+='<div class="bar"><button class="b bl" data-act="new">＋ 新增一筆</button><input type="month" id="mon" value="'+mon+'"><select id="fs"><option value="">全部科目</option>'+D.subj.map(function(s){return'<option'+(s===fs?' selected':'')+'>'+E(s)+'</option>'}).join("")+'</select><input id="q" placeholder="搜尋" value="'+E(q)+'" style="flex:1;min-width:100px"></div>';
 var W=withBal(),L=W.filter(function(x){var r=x.r;return(!mon||r.date.slice(0,7)===mon)&&(!fs||r.subj===fs)&&(!q||(r.item+r.note+r.subj).indexOf(q)>-1)});
 var si=L.reduce(function(s,x){return s+N(x.r.inc)},0),so=L.reduce(function(s,x){return s+N(x.r.exp)},0);
 h+='<p class="note">'+L.length+' 筆，收入 $'+M(si)+'，支出 $'+M(so)+'。點一列可以修改。</p>';
 h+='<div class="tw"><table class="s"><tr><th>序</th><th>日期</th><th>項目</th><th>科目</th><th class="n">收入</th><th class="n">支出</th><th class="n">餘額</th><th>備註</th></tr>'+
  L.map(function(x){var r=x.r;return'<tr class="e" data-ed="'+r.id+'"><td>'+(W.indexOf(x)+1)+'</td><td>'+roc(r.date)+'</td><td class="w">'+E(r.item)+'</td><td>'+E(r.subj)+'</td><td class="n in">'+(N(r.inc)?M(r.inc):"")+'</td><td class="n out">'+(N(r.exp)?M(r.exp):"")+'</td><td class="n">'+M(x.bal)+'</td><td class="w">'+E(r.note)+'</td></tr>'}).join("")+'</table></div>';
 h+='<div class="bar" style="margin-top:10px"><button class="b" data-act="imp">📤 匯入本帳 Excel</button><button class="b" data-act="xl">📥 匯出 Excel</button></div>';
 return h}
function formUI(){var r=ed,isNew=!D.rows.some(function(x){return x.id===r.id});
 return'<div class="fm"><b>'+(isNew?"新增":"修改")+'一筆</b><div class="row2"><div><label>日期</label><input type="date" id="f_date" value="'+E(r.date)+'"></div><div><label>科目</label><select id="f_subj">'+(r.subj&&D.subj.indexOf(r.subj)<0?[r.subj]:[]).concat(D.subj).map(function(s){return'<option'+(s===r.subj?' selected':'')+'>'+E(s)+'</option>'}).join("")+'</select></div></div>'+
 '<label>項目</label><input id="f_item" value="'+E(r.item)+'"><div class="row2"><div><label>收入</label><input id="f_inc" type="number" inputmode="decimal" value="'+E(r.inc||"")+'"></div><div><label>支出（含手續費）</label><input id="f_exp" type="number" inputmode="decimal" value="'+E(r.exp||"")+'"></div></div>'+
 '<label>備註</label><input id="f_note" value="'+E(r.note)+'"><div class="bar" style="margin-top:10px"><button class="b g" data-act="ok">儲存</button><button class="b" data-act="no">取消</button>'+(isNew?'':'<button class="b" data-act="del" style="margin-left:auto">刪除</button>')+'</div></div>'}

// 預算對照：實際＝本帳支出（不含轉到零用金的「零用金」）＋零用金憑證
function actual(){var a={};function add(s,m,v){a[s]=a[s]||{};a[s][m]=(a[s][m]||0)+v}
 D.rows.forEach(function(r){if(N(r.exp)&&r.subj!=="零用金"&&r.subj!=="代墊款歸還")add(r.subj||"（未分類）",r.date.slice(0,7),N(r.exp))});
 if(P&&P.v)P.v.forEach(function(v){var t=v.items.reduce(function(s,i){return s+N(i.p)*N(i.q)},0);add(v.subj||"（未分類）",String(v.date).slice(0,7),t)});return a}
function bUI(){var ms=months(),A=actual(),S=BUDGET_SUBJ.slice();Object.keys(A).forEach(function(s){if(S.indexOf(s)<0)S.push(s)});
 var h='<div class="card"><div class="bar"><span>起始月份</span><input type="month" id="bstart" value="'+D.bstart+'"><span class="note">每格上面填預算，下面是實際支出（本帳＋零用金）。</span></div></div>';
 h+='<div class="tw"><table class="s bg"><tr><th>科目</th>'+ms.map(function(m){return'<th class="n">'+(+m.slice(0,4)-1911)+'/'+m.slice(5)+'</th>'}).join("")+'<th class="n">合計</th></tr>';
 var colB={},colA={};
 S.forEach(function(s){var tb=0,ta=0;h+='<tr><td>'+E(s)+'</td>'+ms.map(function(m){var b=N((D.budget[s]||{})[m]),x=(A[s]||{})[m]||0;tb+=b;ta+=x;colB[m]=(colB[m]||0)+b;colA[m]=(colA[m]||0)+x;
  return'<td class="n">'+(BUDGET_SUBJ.indexOf(s)>-1?'<input data-bs="'+E(s)+'" data-bm="'+m+'" type="number" inputmode="numeric" value="'+(b||"")+'" placeholder="預算">':'')+'<br><small class="'+(b&&x>b?'bad':'note')+'">實 '+M(x)+'</small></td>'}).join("")+'<td class="n">'+M(tb)+'<br><small class="'+(tb&&ta>tb?'bad':'note')+'">實 '+M(ta)+'</small></td></tr>'});
 var TB=0,TA=0;h+='<tr><th>本月支出</th>'+ms.map(function(m){TB+=colB[m]||0;TA+=colA[m]||0;return'<th class="n">'+M(colB[m])+'<br><small class="'+(colB[m]&&colA[m]>colB[m]?'bad':'note')+'">實 '+M(colA[m])+'</small></th>'}).join("")+'<th class="n">'+M(TB)+'<br><small>實 '+M(TA)+'</small></th></tr></table></div>';
 return h+'<p class="note">紅字＝實際超過預算。股金、工程、土地、建築等籌備期支出也會列在下方，供參考。</p>'}

// ===== 應付尾款：合約總額 − 收支表中符合關鍵字的付款（扣手續費、加回退款）=====
function feeOf(r){var m=String(r.note||"").match(/手續費\s*(\d+)/);if(m)return N(m[1]);var x=N(r.exp)%1000;return N(r.exp)>1000&&(x===15||x===30)?x:0}
function kws(p){return String(p.kw||p.vendor||"").split(/[,，、\s]+/).filter(Boolean)}
function payRows(p){if(p.nomatch)return[];var K=kws(p);if(!K.length)return[];return sorted().filter(function(r){var t=(r.item||"")+" "+(r.note||"");return K.some(function(k){return t.indexOf(k)>-1})})}
function paidOf(p){return payRows(p).reduce(function(s,r){return s+(N(r.exp)?N(r.exp)-feeOf(r):0)-N(r.inc)},0)+N(p.adj)}
function restOf(p){return N(p.total)-paidOf(p)}
function payOut(){return(D.pay||[]).reduce(function(s,p){var x=restOf(p);return s+(x>0?x:0)},0)}
function pUI(){D.pay=D.pay||[];var h='<div class="card"><h3>應付尾款</h3><p class="note" style="margin:0 0 6px">輸入合約總額，「已付」會自動加總收支表裡項目或備註含有關鍵字的付款（扣掉手續費、加回退款）。付款時在收支表記一筆，項目寫上廠商名稱就會自動算進去。</p>'+
 '<div class="kv"><span>未付尾款合計</span><b class="big bad">$'+M(payOut())+'</b></div><div class="bar" style="margin-top:8px"><button class="b bl" data-act="pnew">＋ 新增應付款</button><button class="b" data-act="pimp">📤 從 Excel 工程款支出表匯入</button></div></div>';
 if(ped)h+='<div class="fm"><b>'+(D.pay.some(function(p){return p.id===ped.id})?"修改":"新增")+'應付款</b><div class="row2"><div><label>廠商</label><input id="p_vendor" value="'+E(ped.vendor)+'"></div><div><label>項目</label><input id="p_item" placeholder="例如 水電工程" value="'+E(ped.item)+'"></div></div><div class="row2"><div><label>合約總額</label><input id="p_total" type="number" inputmode="numeric" value="'+E(ped.total)+'"></div><div><label>預計付款日（選填）</label><input id="p_due" type="date" value="'+E(ped.due)+'"></div></div><label>對應收支表的關鍵字（多個用逗號分開，空白就用廠商名稱）</label><input id="p_kw" placeholder="例如 吉旺,吳宥" value="'+E(ped.kw)+'"><div class="row2"><div><label>已付調整（選填，例如現金付款或收支表以外的付款）</label><input id="p_adj" type="number" inputmode="numeric" value="'+E(ped.adj)+'"></div><div><label>備註</label><input id="p_note" value="'+E(ped.note)+'"></div></div><div class="bar" style="margin-top:10px"><button class="b g" data-act="pok">儲存</button><button class="b" data-act="pno">取消</button>'+(D.pay.some(function(p){return p.id===ped.id})?'<button class="b" data-act="pdel" style="margin-left:auto">刪除</button>':'')+'</div></div>';
 var P=D.pay.slice().sort(function(a,b){return(restOf(a)<=0)-(restOf(b)<=0)||restOf(b)-restOf(a)});
 h+=P.map(function(p){var rest=restOf(p),R=payRows(p),done=rest<=0;return'<div class="it"><div class="t"><b>'+E(p.vendor)+(p.item?'　'+E(p.item):'')+'</b><span class="amt'+(done?'" style="color:#3f8a5c':'')+'">'+(done?'✅ 已付清':'尾款 $'+M(rest))+'</span></div><small>合約 $'+M(p.total)+' ・ 已付 $'+M(paidOf(p))+'（'+R.length+' 筆'+(N(p.adj)?'，含調整 '+M(p.adj):'')+'）'+(p.due?' ・ 預計 '+E(p.due):'')+(p.note?' ・ '+E(p.note):'')+'</small>'+
  (pop===p.id?'<table class="s" style="margin-top:6px"><tr><th>日期</th><th>項目</th><th class="n">付款</th><th class="n">手續費</th><th class="n">退款</th></tr>'+R.map(function(r){return'<tr><td>'+roc(r.date)+'</td><td class="w">'+E(r.item)+(r.note?'<br><small class="note">'+E(r.note)+'</small>':'')+'</td><td class="n">'+(N(r.exp)?M(r.exp):"")+'</td><td class="n">'+(feeOf(r)?M(feeOf(r)):"")+'</td><td class="n in">'+(N(r.inc)?M(r.inc):"")+'</td></tr>'}).join("")+'</table>':'')+
  '<div class="bar" style="margin:6px 0 0">'+(done?'':'<button class="b bl" data-ppay="'+p.id+'">💸 記一筆付款</button>')+'<button class="b" data-pop="'+p.id+'">'+(pop===p.id?'收起明細':'付款明細')+'</button><button class="b" data-ped="'+p.id+'">編輯</button></div></div>'}).join("")||'<p class="note" style="text-align:center">還沒有應付款。</p>';
 return h}
async function importPay(f){var sh=await readSheet(f,/工程款/),R=sh.rows,out=[];
 if(!/工程款/.test(sh.name)){alert("找不到「工程款支出表」工作表");return}
 for(var r=1;r<R.length;r++){var x=R[r]||[],name=x[0],tot=x[1],paidT=N(x[2]);if(typeof name!=="string"||typeof tot!=="number"||!name.trim())continue;
  var kw=name.trim().replace(/(股份有限公司|有限公司|公司|營造|工程)$/,"")||name.trim(),p0={id:uid(),vendor:name.trim(),item:"",total:tot,kw:kw,adj:"",due:"",note:""};
  if(paidT>=tot){p0.nomatch=true;p0.adj=paidT;p0.note="工程款支出表標示已付清"}
  else{var m=paidOf(p0);if(paidT>m){p0.adj=paidT-m;p0.note="工程款支出表已匯 "+M(paidT)+"，其中 "+M(paidT-m)+" 不在收支表"}}out.push(p0)}
 var have={};(D.pay||[]).forEach(function(p){have[p.vendor]=1});var nw=out.filter(function(p){return!have[p.vendor]});
 if(!nw.length){alert("檔案裡的 "+out.length+" 項都已經在應付尾款裡了");return}
 if(!confirm("要匯入 "+nw.length+" 項嗎？\n"+nw.map(function(p){return p.vendor+" $"+M(p.total)}).join("\n")+"\n\n匯入後請檢查每一項的關鍵字是否能對到收支表的付款。"))return;
 D.pay=(D.pay||[]).concat(nw);save();render()}
function setUI(){return'<div class="card"><h3>科目（一行一個）</h3><textarea id="s_subj" rows="14" style="width:100%">'+E(D.subj.join("\n"))+'</textarea><div class="bar" style="margin-top:8px"><button class="b g" data-act="sset">儲存</button></div></div>'}

// 匯入：本帳 Excel 的「收支表」工作表（序、日期、項目、科目、收入、支出、備註）
async function importXl(f){var sh=await readSheet(f,/收支/),R=sh.rows,hr=-1,col={};
 for(var r=1;r<R.length&&hr<0;r++){var row=R[r]||[];if(row.some(function(v){return v==="項目"})&&row.some(function(v){return v==="日期"}))hr=r}
 if(hr<0){alert("找不到「日期、項目」標題列，請確認是本帳的收支表");return}
 (R[hr]||[]).forEach(function(v,c){if(v)col[String(v).trim()]=c});
 var out=[];for(var r2=hr+1;r2<R.length;r2++){var x=R[r2]||[],item=x[col["項目"]],inc=N(x[col["收入"]]),exp=N(x[col["支出"]]);var d=iso(x[col["日期"]]);
  if(!item&&!inc&&!exp)continue;if(!d)continue;out.push({id:uid(),date:d,item:String(item||"").trim(),subj:String(x[col["科目"]]||"").trim(),inc:inc||"",exp:exp||"",note:String(x[col["備註"]]||"").trim(),ord:r2})}
 if(!out.length){alert("沒有讀到資料");return}
 var sig=function(r){return r.date+"|"+r.item+"|"+N(r.inc)+"|"+N(r.exp)},have={};D.rows.forEach(function(r){have[sig(r)]=1});
